[package]
name = "relay"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive", "env"] }
futures-util = "0.3.31"
hex = "0.4.3"
mdns-sd = "0.21.3"
notify-rust = "4.11.7"
rcgen = "0.14.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-rustls = "0.26.5"
tokio-tungstenite = "0.27.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
